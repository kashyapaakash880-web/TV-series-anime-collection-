{% extends 'base.html' %}

{% block title %}Select Shows {% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select TV Shows and Anime</h1>

    {% for movie in series %}

  <p>
      <a href="{{ url_for('add_shows', id=movie['id']) }}">
         {{ movie.original_name }} - {{ movie.first_air_date }}
      </a>
  </p>
    {% endfor %}


</div>
{% endblock %}
